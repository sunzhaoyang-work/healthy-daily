<!doctype html><html lang="zh-CN"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>阿阳 · 健身记录</title><style>*{box-sizing:border-box}body{margin:0;background:#f2f6fd;color:#243451;font:15px/1.6 -apple-system,BlinkMacSystemFont,"PingFang SC",sans-serif}main{max-width:550px;margin:auto;padding:20px 15px}h1{font-size:26px;margin:5px 0}h2{font-size:19px;margin:0 0 10px}.sub{color:#73839e;font-size:13px}.card{background:white;padding:18px;margin:14px 0;border-radius:18px;box-shadow:0 6px 24px #183b7410}.hero{background:linear-gradient(135deg,#e0ecff,#fff)}.grid{display:grid;grid-template-columns:1fr 1fr;gap:9px}.stat{padding:12px;background:#eaf2ff;border-radius:12px}.stat b{display:block;font-size:19px;color:#3568b1}button{border:0;background:#3979cc;color:white;border-radius:11px;padding:10px 14px;font:inherit}.day{background:#e8effb;color:#3568b1}.day.on{background:#3979cc;color:white}input,select,textarea{display:block;width:100%;border:1px solid #cfdbed;border-radius:10px;padding:10px;margin:5px 0 12px;font:inherit}textarea{height:76px}.line{border-bottom:1px solid #e9eef7;padding:10px 0}.hint{background:#eaf2ff;padding:10px;border-radius:12px;margin:10px 0}canvas{width:100%;height:160px}a{color:#3979cc;text-decoration:none}</style><main><a href="./">← 返回她的健康生活</a><div class="card hero"><div class="sub">💪 健身 · 饮食 · 恢复</div><h1>阿阳的训练日记</h1><p>每周工作六天，安排3次力量训练；记录晨起空腹体重、三餐和训练表现。</p><div class="grid"><div class="stat">力量训练<b>每周3次</b></div><div class="stat">训练重点<b>肩 / 胸 / 背</b></div></div></div><div class="card"><h2>今日训练安排</h2><label>日期<input type="date" id="date" onchange="render()"></label><div id="workout"></div></div><div class="card"><h2>每日空腹体重与训练打卡</h2><label>晨起空腹体重（kg）<input id="weight" type="number" min="35" max="250" step="0.1" placeholder="例如77.5"></label><label>训练状态<select id="status"><option value="">未记录</option><option>已完成</option><option>恢复休息</option><option>调整训练</option></select></label><label>训练重量、组数与体感<textarea id="notes" placeholder="肩推12kg×10次×3组，余力2次"></textarea></label><button onclick="save()">保存今日记录</button><div id="saved" class="sub"></div></div><div class="card"><h2>一周上班族三餐</h2><p class="sub">鸡蛋、牛奶、土豆、肉类、蔬菜为基础；支持带饭和普通外卖，按食欲及训练量调整份量。</p><div id="days" class="grid"></div><div id="menu"></div></div><div class="card"><h2>空腹体重趋势</h2><div id="summary" class="grid"></div><canvas id="chart" width="600" height="200"></canvas><p class="sub">观察数周趋势，不必因一天涨跌而减少饮食。</p></div><div class="card"><h2>备份与恢复</h2><button onclick="backup()">导出我的记录</button> <label style="display:inline-block;background:#e6effd;border-radius:11px;padding:10px">导入记录<input type="file" accept="application/json" style="display:none" onchange="restore(event)"></label><p class="sub">数据仅保存在当前设备浏览器；不同手机不自动同步。</p></div></main><script>
const key="healthy-daily-his-v1";let data={records:{}};try{data=JSON.parse(localStorage.getItem(key))||{records:{}}}catch(e){}data.records ||= {};
const workouts=[["周一｜肩部＋上肢","45–55分钟",["热身5–8分钟","器械或哑铃肩推 3组×8–12次","侧平举 3组×12–15次","反向飞鸟 3组×12–15次","上斜卧推 2组×8–12次","肱二弯举 2组×10–12次"]],["周二｜恢复日","20–30分钟",["午休散步20分钟","肩颈、髋部拉伸5分钟"]],["周三｜胸＋肱三","45–55分钟",["热身5–8分钟","平板卧推 3组×6–10次","上斜卧推 3组×8–12次","绳索夹胸 2组×12–15次","绳索下压 3组×10–12次","平板支撑 2组×30–45秒"]],["周四｜轻活动","20–30分钟",["饭后步行20分钟","胸椎和肩部活动5分钟"]],["周五｜背＋腿","50–60分钟",["热身5–8分钟","高位下拉 3组×8–12次","坐姿划船 3组×8–12次","腿举或深蹲 3组×8–12次","罗马尼亚硬拉 2组×8–10次","卷腹 2组×12–15次"]],["周六｜恢复","20–30分钟",["散步或轻松骑车20–30分钟","疲劳时优先休息"]],["周日｜休息","按需",["充分休息","可提前准备带饭食材"]]];
const meals=[["鸡蛋2个＋牛奶＋燕麦＋香蕉","鸡肉米饭＋西兰花（带饭）","牛肉土豆＋青菜＋米饭"],["鸡蛋＋馒头＋牛奶＋苹果","老乡鸡：鸡肉主菜＋青菜＋米饭","豆腐虾仁＋米饭＋青菜"],["燕麦牛奶＋鸡蛋＋香蕉","牛肉蔬菜盖饭（带饭）","鸡胸肉＋土豆＋时蔬"],["鸡蛋＋全麦面包＋酸奶","沙县：鸡腿饭＋青菜＋卤蛋","清蒸鱼＋米饭＋西兰花"],["牛奶＋鸡蛋＋燕麦＋水果","鸡肉土豆饭（带饭）","牛排＋米饭＋炒青菜"],["鸡蛋＋馒头＋牛奶","老乡鸡：鸡肉＋青菜＋米饭","番茄炒蛋＋瘦肉＋米饭"],["燕麦＋牛奶＋鸡蛋＋水果","牛肉蔬菜盖饭","鱼肉＋豆腐＋米饭＋时蔬"]];let selected=0;const dateStr=()=>{let d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};document.getElementById("date").value=dateStr();selected=(new Date().getDay()+6)%7;
function render(){let d=document.getElementById("date").value||dateStr(),i=(new Date(d+"T12:00:00").getDay()+6)%7,w=workouts[i],r=data.records[d]||{};document.getElementById("workout").innerHTML='<div class="hint"><b>'+w[0]+"</b> · "+w[1]+"</div>"+w[2].map((v,i)=>'<div class="line">'+(i+1)+". "+v+"</div>").join("")+'<p class="sub">每组留1–3次余力，动作不适就降低重量或休息。</p>';document.getElementById("weight").value=r.weight||"";document.getElementById("status").value=r.status||"";document.getElementById("notes").value=r.notes||"";renderChart()}
function save(){let d=document.getElementById("date").value,v=document.getElementById("weight").value;if(v&&(Number(v)<35||Number(v)>250))return alert("请检查体重数值");data.records[d]={weight:v,status:document.getElementById("status").value,notes:document.getElementById("notes").value};localStorage.setItem(key,JSON.stringify(data));document.getElementById("saved").textContent="✓ 已保存 "+d;renderChart()}
function menu(){document.getElementById("days").innerHTML=["一","二","三","四","五","六","日"].map((v,i)=>'<button class="day '+(i===selected?"on":"")+'" onclick="selected='+i+';menu()">周'+v+"</button>").join("");document.getElementById("menu").innerHTML=meals[selected].map((v,i)=>'<div class="line"><b>'+["早餐","午餐","晚餐"][i]+"</b><div>"+v+"</div></div>").join("")}
function renderChart(){let a=Object.entries(data.records).filter(([d,r])=>r.weight&&Number.isFinite(Number(r.weight))).sort((x,y)=>x[0].localeCompare(y[0])).slice(-30),last=a[a.length-1];document.getElementById("summary").innerHTML='<div class="stat">最近空腹体重<b>'+(last?last[1].weight+" kg":"暂无")+'</b></div><div class="stat">已记录<b>'+a.length+" 天</b></div>";let c=document.getElementById("chart"),ctx=c.getContext("2d");ctx.clearRect(0,0,600,200);if(a.length<2){ctx.fillStyle="#73839e";ctx.font="21px sans-serif";ctx.fillText("记录2天后显示体重趋势",90,100);return}let v=a.map(x=>Number(x[1].weight)),min=Math.min(...v)-.8,max=Math.max(...v)+.8;ctx.strokeStyle="#cdd9eb";ctx.beginPath();ctx.moveTo(45,15);ctx.lineTo(45,165);ctx.lineTo(580,165);ctx.stroke();ctx.strokeStyle="#3979cc";ctx.lineWidth=4;ctx.beginPath();v.forEach((n,i)=>{let x=50+i*520/(v.length-1),y=150-(n-min)/(max-min)*125;i?ctx.lineTo(x,y):ctx.moveTo(x,y)});ctx.stroke();ctx.fillStyle="#73839e";ctx.font="16px sans-serif";ctx.fillText(max.toFixed(1),2,26);ctx.fillText(min.toFixed(1),2,165)}
function backup(){let u=URL.createObjectURL(new Blob([JSON.stringify(data,null,2)],{type:"application/json"})),a=document.createElement("a");a.href=u;a.download="我的健身记录-"+dateStr()+".json";a.click();setTimeout(()=>URL.revokeObjectURL(u),1000)}function restore(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let x=JSON.parse(r.result);if(!x||!x.records||typeof x.records!=="object"||Array.isArray(x.records))throw Error();if(confirm("导入将覆盖当前健身记录，确定吗？")){data=x;localStorage.setItem(key,JSON.stringify(data));render()}}catch(e){alert("文件格式不正确")}};r.readAsText(f)}render();menu();
</script></html>
